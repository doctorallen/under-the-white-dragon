<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Downlevel">
<meta name="description" content="A side-scrolling cyberpunk descent through a vertical city: strip machines, crack nodes, wire it into your body, go further down.">
<title>Downlevel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="vitals">
    <div id="hp"><div id="hpfill"></div></div>
    <div id="ram"></div>
    <div id="charge"></div>
    <span id="cr"></span>
  </div>
  <div id="where"><span id="place"></span><span id="clock"></span><span id="obj"></span></div>
  <div id="topbtns">
    <button id="bCab">Cab</button>
    <button id="bPack">Gear</button>
    <button id="bMenu" aria-label="Pause">II</button>
  </div>
  <div id="boss" hidden><span id="bossname">THE WARDEN</span><div><div id="bossfill"></div></div></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="bubbles"></div>
  <div id="promptwrap"><div id="prompt"></div><div id="hold"><div id="holdbar"></div></div></div>
</div>

<div id="stickzone"></div>
<div id="stick"><div id="knob"></div></div>
<div id="pads">
  <button id="bItem">Item</button>
  <button id="bProg">Program</button>
  <button id="bUse">Use</button>
  <button id="bStrike">Fire</button>
  <button id="bJump">Jump</button>
</div>

<section id="panel" hidden>
  <header><h2 id="panelTitle"></h2><span id="panelCr" hidden></span><button id="panelClose" aria-label="Close">✕</button></header>
  <div id="panelBody"></div>
</section>

<section id="hack" hidden><canvas id="hackcv"></canvas><p>Jacking in</p></section>

<div id="loading">Painting the city…</div>
<div id="rotate">Turn your phone sideways.</div>

<script src="js/util.js"></script>
<script src="js/tuning.js"></script>
<script src="js/spr.js"></script>
<script src="js/paint.js"></script>
<script src="js/people.js"></script>
<script src="js/props.js"></script>
<script src="js/items.js"></script>
<script src="js/quests.js"></script>
<script src="js/cases.js"></script>
<script src="js/world.js"></script>
<script src="js/levels.js"></script>
<script src="js/kit.js"></script>
<script src="js/travel.js"></script>
<script src="js/d_high.js"></script>
<script src="js/d_street.js"></script>
<script src="js/d_under.js"></script>
<script src="js/d_old.js"></script>
<script src="js/d_works.js"></script>
<script src="js/d_deep.js"></script>
<script src="js/things.js"></script>
<script src="js/game.js"></script>
<script src="js/save.js"></script>
<script src="js/input.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/actors.js"></script>
<script src="js/hack.js"></script>
<script src="js/life.js"></script>
<script src="js/skyline.js"></script>
<script src="js/flight.js"></script>
<script src="js/map.js"></script>
<script src="js/worldmap.js"></script>
<script src="js/dev.js"></script>
<script src="js/gl.js"></script>
<script src="js/render.js"></script>
<script src="js/hud.js"></script>
<script src="js/panels.js"></script>
<script src="js/pwa.js"></script>
<script src="js/main.js"></script>
</body>
</html>
