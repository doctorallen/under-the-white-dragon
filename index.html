<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="White Dragon">
<meta name="description" content="A noir tinkerer game for the phone: fix what the city breaks, in a hidden basement under a noodle bar.">
<title>Under the White Dragon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="vitals">
    <div id="heat" title="Heat"><div><i id="heatfill"></i></div></div>
    <span id="cr"></span>
  </div>
  <div id="where"><span id="place"></span><span id="clock"></span><span id="obj"></span></div>
  <div id="topbtns">
    <button id="bCab">Cab</button>
    <button id="bPack">Jobs</button>
    <button id="bMenu" aria-label="Pause">II</button>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="bubbles"></div>
  <div id="gains"></div>
  <div id="promptwrap"><div id="prompt"></div><div id="hold"><div id="holdbar"></div></div></div>
</div>

<div id="stickzone"></div>
<div id="stick"><div id="knob"></div></div>
<div id="stickhint"><span>◀</span><span>▶</span></div>
<!-- the tutorial's card: over the stick's touch area, so its buttons take a tap -->
<div id="guide"></div>
<div id="pads">
  <button id="bUse">Use</button>
  <button id="bJump">Jump</button>
</div>

<section id="panel" hidden>
  <header><h2 id="panelTitle"></h2><span id="panelCr" hidden></span><button id="panelClose" aria-label="Close">✕</button></header>
  <div id="panelBody"></div>
</section>


<div id="loading">Painting the city…</div>
<div id="rotate">Turn your phone sideways.</div>
